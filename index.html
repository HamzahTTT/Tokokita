<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoKita</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #F7F4EB;
    color: #134e4a;
    min-height: 100vh;
    padding-bottom: 40px;
    position: relative;
    overflow-x: hidden;
  }

  /* ============ LIQUID METAL BG (COTTON) ============ */
  .liquid-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: #F7F4EB;
  }
  .liquid-bg .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    will-change: transform;
  }
  .liquid-bg .blob1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #99f6e4 0%, transparent 70%);
    opacity: .75;
    top: -150px; left: -150px;
    animation: move1 18s ease-in-out infinite;
  }
  .liquid-bg .blob2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #5eead4 0%, transparent 70%);
    opacity: .55;
    bottom: -200px; right: -200px;
    animation: move2 22s ease-in-out infinite;
  }
  .liquid-bg .blob3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #ccfbf1 0%, transparent 70%);
    opacity: .85;
    top: 40%; left: 40%;
    animation: move3 16s ease-in-out infinite;
  }
  .liquid-bg .blob4 {
    width: 550px; height: 550px;
    background: radial-gradient(circle, #a7f3d0 0%, transparent 70%);
    opacity: .5;
    top: 60%; left: -10%;
    animation: move4 20s ease-in-out infinite;
  }

  @keyframes move1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(180px, 120px) scale(1.3); }
    66% { transform: translate(80px, 240px) scale(.9); }
  }
  @keyframes move2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-220px, -140px) scale(1.25); }
  }
  @keyframes move3 {
    0%, 100% { transform: translate(-50%,-50%) scale(1); }
    25% { transform: translate(-30%,-70%) scale(1.4); }
    75% { transform: translate(-70%,-30%) scale(.85); }
  }
  @keyframes move4 {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    50% { transform: translate(200px, -180px) rotate(180deg); }
  }

  /* ============ HEADER — GLASS ============ */
  header {
    position: sticky; top: 0; z-index: 60;
    background: rgba(255,255,255,.65);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 4px 24px rgba(13,148,136,.08);
  }
  .head {
    max-width: 1100px; margin: 0 auto;
    padding: 14px 20px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.3px;
  white-space: nowrap;
  display: inline-flex;
  user-select: none;
}

.logo span {
  display: inline-block;
  background: linear-gradient(
    90deg,
    #0f766e 0%,
    #14b8a6 15%,
    #5eead4 30%,
    #99f6e4 45%,
    #5eead4 60%,
    #14b8a6 75%,
    #0f766e 100%
  );
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation:
    logoWave 2.4s ease-in-out infinite,
    logoFlow 3.5s linear infinite;
  will-change: transform, background-position;
}

@keyframes logoWave {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-4px) scale(1.06); }
}

@keyframes logoFlow {
  0%   { background-position: 200% 50%; }
  100% { background-position: 0% 50%; }
}

/* Delay bergelombang per huruf */
.logo span:nth-child(1)  { animation-delay: 0s, 0s; }
.logo span:nth-child(2)  { animation-delay: .08s, 0s; }
.logo span:nth-child(3)  { animation-delay: .16s, 0s; }
.logo span:nth-child(4)  { animation-delay: .24s, 0s; }
.logo span:nth-child(5)  { animation-delay: .32s, 0s; }
.logo span:nth-child(6)  { animation-delay: .40s, 0s; }
.logo span:nth-child(7)  { animation-delay: .48s, 0s; }
.logo span:nth-child(8)  { animation-delay: .56s, 0s; }
.logo span:nth-child(9)  { animation-delay: .64s, 0s; }
.logo span:nth-child(10) { animation-delay: .72s, 0s; }
.logo span:nth-child(11) { animation-delay: .80s, 0s; }
  .search {
    flex: 1; min-width: 120px;
    padding: 10px 18px;
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 999px;
    outline: none; font-size: 14px;
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #134e4a;
    transition: .25s;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.9), 0 2px 8px rgba(13,148,136,.06);
  }
  .search::placeholder { color: #8aa8a5; }
  .search:focus {
    border-color: #5eead4;
    background: rgba(255,255,255,.85);
    box-shadow: 0 0 0 4px rgba(94,234,212,.25), inset 0 1px 2px rgba(255,255,255,.9);
  }

  /* ============ BUTTONS ============ */
  .btn {
    border: none; cursor: pointer;
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 14px; font-weight: 700;
    font-family: inherit;
    position: relative;
    overflow: hidden;
    transition: transform .15s ease, box-shadow .3s ease, background .3s ease;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: .2px;
  }
  .btn:active { transform: scale(.94); }

  .btn-teal {
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff;
    border: 1px solid rgba(255,255,255,.3);
    box-shadow:
      0 6px 18px rgba(13,148,136,.35),
      inset 0 1px 1px rgba(255,255,255,.35);
  }
  .btn-teal:hover {
    background: linear-gradient(135deg, #0f766e, #134e4a);
    box-shadow: 0 8px 22px rgba(13,148,136,.45);
  }

  .btn-light {
    background: rgba(255,255,255,.7);
    color: #0f766e;
    border: 1px solid rgba(255,255,255,.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 12px rgba(13,148,136,.08), inset 0 1px 1px rgba(255,255,255,.9);
  }
  .btn-light:hover { background: rgba(255,255,255,.9); }

  .btn-sm { padding: 9px 14px; font-size: 13px; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    transform: scale(0);
    animation: rippleAnim .7s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* ============ CART BUTTON (FIX BADGE) ============ */
  .cart-btn {
    position: relative;
    overflow: visible !important;
  }
  .cart-btn .btn-inner {
    display: inline-block;
    position: relative;
    overflow: hidden;
    border-radius: 14px;
  }
  .badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    color: #7c2d12;
    font-size: 11px;
    font-weight: 800;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.2), inset 0 1px 1px rgba(255,255,255,.9);
    border: 2px solid #fff;
    z-index: 10;
  }

  /* ============ HERO ============ */
  .wrap { max-width: 1100px; margin: 22px auto; padding: 0 20px; }
  .hero {
    background: linear-gradient(135deg, rgba(13,148,136,.95), rgba(15,118,110,.95));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 22px;
    padding: 26px;
    color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    box-shadow:
      0 10px 34px rgba(13,148,136,.3),
      inset 0 1px 1px rgba(255,255,255,.35);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%);
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%, 100% { transform: translateX(-40%); }
    50% { transform: translateX(40%); }
  }
  .hero h1 { font-size: 24px; margin-bottom: 6px; position: relative; letter-spacing: -.5px; }
  .hero p { font-size: 13px; opacity: .95; position: relative; }

  /* ============ GRID ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
    margin-top: 22px;
  }

  /* ============ CARDS — GLASS ON LIGHT ============ */
  .card {
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 8px 24px rgba(13,148,136,.1),
      inset 0 1px 1px rgba(255,255,255,.9);
    cursor: pointer;
    transition: transform .3s ease, box-shadow .3s ease;
    position: relative;
    animation: cardIn .4s ease backwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow:
      0 16px 36px rgba(13,148,136,.18),
      inset 0 1px 1px rgba(255,255,255,.95);
  }
  .card:active { transform: translateY(-2px) scale(.99); }

  .thumb {
    position: relative;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: rgba(204,251,241,.4);
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform .4s ease;
  }
  .card:hover .thumb img { transform: scale(1.06); }

  .price {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(15,118,110,.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 4px 12px rgba(13,148,136,.3);
  }

  .body { padding: 14px 14px 16px; }
  .body h3 {
    font-size: 14px; margin-bottom: 5px;
    color: #134e4a;
  }
  .body p {
    font-size: 12px; color: #5e7a77; line-height: 1.4;
    height: 34px; overflow: hidden;
  }

  /* ============ TOMBOL BELI — ANIMASI TEXT SWAP ============ */
  .btn-beli {
    width: 100%;
    margin-top: 12px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff;
    border: 1px solid rgba(255,255,255,.3);
    box-shadow:
      0 6px 18px rgba(13,148,136,.35),
      inset 0 1px 1px rgba(255,255,255,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s cubic-bezier(.68,-0.55,.27,1.55), box-shadow .3s;
  }
  .btn-beli:hover {
    box-shadow: 0 8px 22px rgba(13,148,136,.45);
  }

  .btn-beli .icon {
    display: inline-block;
    transition: transform .3s ease, opacity .15s ease;
  }

  /* Animasi pop — text tetap Beli */
  .btn-beli.pressed {
    animation: beliPop .55s cubic-bezier(.68,-0.55,.27,1.55);
  }
  @keyframes beliPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(.85); }
    65%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* Efek kilau saat diklik */
  .btn-beli::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,.8) 0%, transparent 60%);
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  .btn-beli.pressed::before { animation: flashGlow .55s ease-out; }
  @keyframes flashGlow {
    0% { opacity: 0; }
    40% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Teks icon animasi saat ditekan */
  .btn-beli.pressed .icon {
    animation: iconPop .55s cubic-bezier(.68,-0.55,.27,1.55);
  }
  @keyframes iconPop {
    0%   { transform: scale(1); opacity: 1; }
    35%  { transform: scale(0); opacity: 0; }
    65%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ============ INFO / ERROR ============ */
  .info {
    text-align: center; padding: 50px 20px;
    color: #5e7a77; font-size: 14px;
    grid-column: 1/-1;
  }
  .err {
    text-align: center; padding: 40px 22px;
    color: #b91c1c; font-size: 13px;
    background: rgba(254,242,242,.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(220,38,38,.2);
    border-radius: 14px;
    margin-top: 20px;
    word-break: break-word;
    line-height: 1.6;
  }

  /* ============ MODAL — GLASS ON LIGHT ============ */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(19,78,74,.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 100;
    opacity: 0;
    transition: opacity .3s;
  }
  .overlay.on { display: flex; opacity: 1; }

  .modal {
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 22px;
    width: 100%; max-width: 440px;
    max-height: 90vh; overflow-y: auto;
    padding: 24px;
    color: #134e4a;
    box-shadow:
      0 24px 60px rgba(13,148,136,.2),
      inset 0 1px 1px rgba(255,255,255,.95);
    transform: translateY(20px) scale(.96);
    transition: transform .35s cubic-bezier(.68,-0.55,.27,1.55);
  }
  .overlay.on .modal { transform: translateY(0) scale(1); }

  .check-circle {
    width: 90px; height: 90px;
    margin: 0 auto;
    background: linear-gradient(135deg, #ccfbf1, #99f6e4);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 50%;
    display: grid; place-items: center;
    box-shadow:
      0 12px 30px rgba(13,148,136,.2),
      inset 0 1px 2px rgba(255,255,255,.9);
    animation: popCircle .55s cubic-bezier(.68,-0.55,.27,1.55);
  }
  @keyframes popCircle {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .check-circle svg path {
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: drawCheck .5s ease .3s forwards;
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  /* ============ CART PANEL ============ */
  .cart-panel {
    position: fixed; top: 0; right: 0; height: 100%;
    width: 350px; max-width: 92vw;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-left: 1px solid rgba(255,255,255,.95);
    z-index: 200;
    display: flex; flex-direction: column;
    transform: translateX(105%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    box-shadow: -16px 0 50px rgba(13,148,136,.15);
    color: #134e4a;
  }
  .cart-panel.on { transform: translateX(0); }
  .cart-head {
    padding: 20px;
    border-bottom: 1px solid rgba(204,251,241,.7);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-head h2 { font-size: 16px; color: #0f766e; }
  .cart-items { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .cart-item {
    display: flex; gap: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: rgba(255,255,255,.7);
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(13,148,136,.06), inset 0 1px 1px rgba(255,255,255,.9);
  }
  .cart-item img {
    width: 60px; height: 60px;
    border-radius: 12px; object-fit: cover;
    border: 1px solid rgba(255,255,255,.6);
  }
  .ci-info { flex: 1; min-width: 0; }
  .ci-info h4 {
    font-size: 13px; margin-bottom: 3px;
    color: #134e4a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ci-info .p { font-size: 12px; color: #5e7a77; }
  .qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .qty button {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.8);
    backdrop-filter: blur(10px);
    cursor: pointer; color: #0f766e; font-weight: 800;
    transition: .2s;
    box-shadow: 0 2px 6px rgba(13,148,136,.1), inset 0 1px 1px rgba(255,255,255,.9);
    font-size: 14px;
  }
  .qty button:hover { background: rgba(204,251,241,.9); }
  .qty button:active { transform: scale(.9); }
  .qty span { font-size: 13px; font-weight: 800; min-width: 18px; text-align: center; color: #134e4a; }
  .ci-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
  .ci-right strong { font-size: 13px; color: #134e4a; }
  .ci-right .rm {
    background: none; border: none; color: #dc2626;
    font-size: 11px; font-weight: 700; cursor: pointer; padding: 0;
  }
  .cart-foot {
    padding: 18px;
    border-top: 1px solid rgba(204,251,241,.7);
    background: rgba(247,244,235,.7);
    backdrop-filter: blur(12px);
  }
  .cart-total {
    display: flex; justify-content: space-between;
    font-size: 14px; margin-bottom: 14px;
    color: #134e4a;
  }
  .cart-total strong { font-size: 20px; color: #0f766e; }
  .cart-foot .btn { width: 100%; justify-content: center; }

  /* ============ TOAST ============ */
  #toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 100px);
    background: linear-gradient(135deg, #0f766e, #134e4a);
    color: #fff;
    padding: 14px 24px;
    border-radius: 14px;
    font-size: 13px; font-weight: 700;
    border: 1px solid rgba(255,255,255,.2);
    opacity: 0;
    transition: .4s cubic-bezier(.68,-0.55,.27,1.55);
    z-index: 999;
    max-width: 90vw; text-align: center;
    box-shadow:
      0 16px 40px rgba(13,148,136,.4),
      inset 0 1px 1px rgba(255,255,255,.25);
  }
  #toast.on { transform: translate(-50%, 0); opacity: 1; }

  #cartOverlay {
    position: fixed; inset: 0;
    background: rgba(19,78,74,.3);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    z-index: 150;
  }
  #cartOverlay.on { display: block; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .hero h1 { font-size: 19px; }
    .hero p { font-size: 12px; }
    .logo { font-size: 16px; }
    .head { padding: 12px 14px; gap: 8px; }
    .search { font-size: 13px; padding: 9px 14px; }
    .body { padding: 12px; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<div class="liquid-bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>

<header>
  <div class="head">
    <div class="logo">
  <div class="logo">
  <span>T</span><span>o</span><span>k</span><span>A</span><span>M</span><span>B</span><span>A</span>
  </div>
    <input type="text" id="cari" class="search" placeholder="Cari produk...">
    <button class="btn btn-teal cart-btn" id="btnCart">
      <span class="btn-inner">Keranjang</span>
      <span class="badge" id="badge">0</span>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>ALL YOU CAN BUY</h1>
    <p>BELANJA DITOKO AMBACONG GRATIS MUWANI</p>
  </div>
  <div id="grid" class="grid"></div>
  <div id="err" class="err" style="display:none"></div>
</div>

<div class="overlay" id="detailModal">
  <div class="modal">
    <img id="dGambar" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid rgba(255,255,255,.6)" alt="">
    <div style="font-size:24px;font-weight:800;color:#0f766e;margin:14px 0 4px" id="dHarga"></div>
    <div style="font-size:18px;font-weight:700;color:#134e4a" id="dNama"></div>
    <p style="font-size:13px;color:#5e7a77;line-height:1.6;margin-top:8px" id="dDesk"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn btn-light" id="btnTutupDetail">Tutup</button>
      <button class="btn btn-teal" id="btnBeliDetail">Beli</button>
    </div>
  </div>
</div>

<div class="overlay" id="checkoutModal">
  <div class="modal" style="text-align:center;max-width:380px">
    <div class="check-circle">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="24" fill="none" stroke="#0d9488" stroke-width="3"/>
        <path d="M14 27 L23 36 L38 19" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 style="color:#0f766e;margin:16px 0 6px;font-size:22px">Checkout Berhasil!</h2>
    <p style="font-size:13px;color:#5e7a77;margin-bottom:18px">Terima kasih sudah berbelanja</p>

    <div style="background:rgba(204,251,241,.5);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:16px;text-align:left;font-size:13px;box-shadow:inset 0 1px 1px rgba(255,255,255,.9)">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="color:#5e7a77">Total item</span>
        <strong id="modalQty" style="color:#134e4a">0</strong>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:15px">
        <span style="color:#5e7a77">Total bayar</span>
        <strong style="color:#0f766e;font-size:17px" id="modalTotal">Rp 0</strong>
      </div>
    </div>

    <button class="btn btn-teal" id="btnTutupModal" style="width:100%;margin-top:18px;justify-content:center">OK</button>
  </div>
</div>

<div id="cartOverlay"></div>
<aside class="cart-panel" id="cartPanel">
  <div class="cart-head">
    <h2>Keranjang Belanja</h2>
    <button class="btn btn-light" id="btnTutupCart">Tutup</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">Rp 0</strong>
    </div>
    <button class="btn btn-teal" id="btnCheckout">Checkout</button>
  </div>
</aside>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://mtjdkivqcltdbgdauapl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10amRraXZxY2x0ZGJnZGF1YXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDUzOTEsImV4cCI6MjEwNjQyMTM5MX0.chzAnuC2SEAVmCw-R6cfLWreYftJq8TozCrQ3qVAYTQ';

if (typeof window.supabase === 'undefined') {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = 'Library Supabase gagal dimuat. Cek koneksi internet, lalu refresh.';
  throw new Error('Supabase CDN tidak dimuat');
}

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);

function rp(n) {
  return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0 }).format(n);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function placeholder(text) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450"><rect width="600" height="450" fill="#0d9488"/><text x="300" y="240" font-family="Arial" font-size="32" fill="#fff" text-anchor="middle">${text}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function addRipple(btn, e) {
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
  const y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);
}

let produkList = [];
let cart = {};
let detailId = null;

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2000);
}
function showError(msg) {
  $('#err').style.display = 'block';
  $('#err').textContent = msg;
}
function hideError() { $('#err').style.display = 'none'; }

/* ============ ANIMASI TOMBOL BELI ============ */
function playBeliAnim(btn) {
  const icon = btn.querySelector('.icon');
  if (!icon) return;

  // Simpan teks asli
  if (!icon.dataset.original) icon.dataset.original = icon.textContent;
  const original = icon.dataset.original;

  // Reset animasi
  btn.classList.remove('pressed');
  void btn.offsetWidth;
  btn.classList.add('pressed');

  // Teks berubah jadi centang
  icon.textContent = '✓';

  // Kembalikan ke "Beli" setelah animasi
  setTimeout(() => {
    icon.textContent = original;
  }, 700);

  setTimeout(() => {
    btn.classList.remove('pressed');
  }, 800);
}

/* ============ LOAD PRODUK ============ */
async function loadProduk() {
  $('#grid').innerHTML = '<div class="info">Memuat produk...</div>';
  hideError();

  try {
    const { data, error } = await db
      .from('products')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Supabase error:', error);
      $('#grid').innerHTML = '';
      showError('Gagal memuat produk: ' + error.message);
      return;
    }

    produkList = (data || []).map(p => ({
      id: String(p.id),
      name: p.name || '(Tanpa nama)',
      price: Number(p.price) || 0,
      image: p.image || placeholder('Produk'),
      desc: p.description || ''
    }));

    renderProduk();
  } catch (err) {
    console.error('Exception:', err);
    $('#grid').innerHTML = '';
    showError('Error: ' + err.message);
  }
}

/* ============ RENDER ============ */
function renderProduk() {
  const q = $('#cari').value.trim().toLowerCase();
  const list = produkList.filter(p =>
    p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q)
  );

  if (!produkList.length) {
    $('#grid').innerHTML = '<div class="info">Belum ada produk. Tambah dulu di Supabase.</div>';
    return;
  }
  if (!list.length) {
    $('#grid').innerHTML = '<div class="info">Produk tidak ditemukan.</div>';
    return;
  }

  $('#grid').innerHTML = list.map((p, i) => `
    <div class="card" data-id="${p.id}" style="animation-delay: ${i * 0.05}s">
      <div class="thumb">
        <img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.src='${placeholder('No Image')}'">
        <span class="price">${rp(p.price)}</span>
      </div>
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.desc || 'Tanpa deskripsi')}</p>
        <button class="btn btn-beli btn-sm" data-act="beli">
          <span class="icon">Beli</span>
        </button>
      </div>
    </div>
  `).join('');
}

/* ============ KLIK KARTU ============ */
$('#grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const actBtn = e.target.closest('[data-act]');
  const act = actBtn ? actBtn.dataset.act : null;

  if (act === 'beli') {
    playBeliAnim(actBtn);
    addRipple(actBtn, e);
    addCart(id);
  } else {
    bukaDetail(id);
  }
});

/* ============ DETAIL ============ */
function bukaDetail(id) {
  const p = produkList.find(x => String(x.id) === String(id));
  if (!p) return;
  detailId = id;
  $('#dGambar').src = p.image;
  $('#dNama').textContent = p.name;
  $('#dHarga').textContent = rp(p.price);
  $('#dDesk').textContent = p.desc || 'Tanpa deskripsi';
  $('#detailModal').classList.add('on');
}

$('#btnTutupDetail').addEventListener('click', () => $('#detailModal').classList.remove('on'));
$('#btnBeliDetail').addEventListener('click', (e) => {
  if (detailId) {
    addRipple(e.currentTarget, e);
    addCart(detailId);
    $('#detailModal').classList.remove('on');
  }
});

/* ============ CART ============ */
function loadCart() {
  try { cart = JSON.parse(localStorage.getItem('tokokita_cart')) || {}; } catch (e) { cart = {}; }
}
function saveCart() {
  try { localStorage.setItem('tokokita_cart', JSON.stringify(cart)); } catch (e) {}
}

function addCart(id) {
  const p = produkList.find(x => String(x.id) === String(id));
  if (!p) return;
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  renderCart();
  toast('"' + p.name + '" masuk keranjang');
}

function changeQty(id, d) {
  if (!cart[id]) return;
  cart[id] += d;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  renderCart();
}

function removeCart(id) {
  delete cart[id];
  saveCart();
  renderCart();
}

function renderCart() {
  const items = Object.entries(cart)
    .map(([id, qty]) => ({ p: produkList.find(x => String(x.id) === String(id)), qty }))
    .filter(x => x.p);

  const totalQty = items.reduce((a, b) => a + b.qty, 0);
  const totalPrice = items.reduce((a, b) => a + b.p.price * b.qty, 0);

  $('#badge').textContent = totalQty;
  $('#cartTotal').textContent = rp(totalPrice);

  const box = $('#cartItems');
  if (!items.length) {
    box.innerHTML = '<div style="text-align:center;padding:40px 10px;color:#5e7a77;font-size:13px">Keranjang masih kosong</div>';
    return;
  }

  box.innerHTML = items.map(({ p, qty }) => `
    <div class="cart-item">
      <img src="${esc(p.image)}" alt="">
      <div class="ci-info">
        <h4>${esc(p.name)}</h4>
        <div class="p">${rp(p.price)}</div>
        <div class="qty">
          <button data-q="-1" data-id="${p.id}">−</button>
          <span>${qty}</span>
          <button data-q="1" data-id="${p.id}">+</button>
        </div>
      </div>
      <div class="ci-right">
        <strong>${rp(p.price * qty)}</strong>
        <button class="rm" data-rm="${p.id}">Hapus</button>
      </div>
    </div>
  `).join('');
}

$('#cartItems').addEventListener('click', (e) => {
  const qBtn = e.target.closest('[data-q]');
  const rmBtn = e.target.closest('[data-rm]');
  if (qBtn) changeQty(qBtn.dataset.id, Number(qBtn.dataset.q));
  else if (rmBtn) removeCart(rmBtn.dataset.rm);
});

$('#btnCart').addEventListener('click', () => {
  $('#cartPanel').classList.add('on');
  $('#cartOverlay').classList.add('on');
});
$('#btnTutupCart').addEventListener('click', () => {
  $('#cartPanel').classList.remove('on');
  $('#cartOverlay').classList.remove('on');
});
$('#cartOverlay').addEventListener('click', () => {
  $('#cartPanel').classList.remove('on');
  $('#cartOverlay').classList.remove('on');
});

/* ============ CHECKOUT ============ */
$('#btnCheckout').addEventListener('click', (e) => {
  addRipple(e.currentTarget, e);
  const items = Object.entries(cart).filter(([id]) => produkList.find(x => String(x.id) === String(id)));
  const totalQty = items.reduce((a, [,q]) => a + q, 0);
  if (!totalQty) return toast('Keranjang masih kosong');

  const total = items.reduce((sum, [id, qty]) => {
    const p = produkList.find(x => String(x.id) === String(id));
    return sum + (p ? p.price * qty : 0);
  }, 0);

  $('#modalQty').textContent = totalQty;
  $('#modalTotal').textContent = rp(total);
  $('#checkoutModal').classList.add('on');

  cart = {};
  saveCart();
  renderCart();
  $('#cartPanel').classList.remove('on');
  $('#cartOverlay').classList.remove('on');
});

$('#btnTutupModal').addEventListener('click', (e) => {
  addRipple(e.currentTarget, e);
  $('#checkoutModal').classList.remove('on');
});
$('#checkoutModal').addEventListener('click', (e) => {
  if (e.target === $('#checkoutModal')) $('#checkoutModal').classList.remove('on');
});

/* ============ SEARCH ============ */
$('#cari').addEventListener('input', renderProduk);

$('#detailModal').addEventListener('click', (e) => {
  if (e.target === $('#detailModal')) $('#detailModal').classList.remove('on');
});

/* ============ INIT ============ */
loadCart();
loadProduk();
</script>
</body>
</html>
