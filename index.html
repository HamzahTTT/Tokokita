<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoKita — Web Jualan Sederhana</title>

<!-- ============ SUPABASE CDN ============ -->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #0d9488;
    --primary-dark: #0f766e;
    --primary-light: #ccfbf1;
    --bg: #f0fdfa;
    --card: #ffffff;
    --text: #134e4a;
    --muted: #475569;
    --line: #ccfbf1;
    --radius: 16px;
    --shadow: 0 6px 24px rgba(13, 148, 136, 0.12);
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ============ HEADER ============ */
  header {
    position: sticky; top: 0; z-index: 60;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .logo {
    font-size: 22px; font-weight: 800; letter-spacing: -.5px;
    color: var(--primary-dark);
    white-space: nowrap;
  }
  .search {
    flex: 1; min-width: 160px;
    padding: 10px 16px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 14px; outline: none;
    transition: .2s; background: #fff; color: var(--text);
  }
  .search:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(13, 148, 136, .15); }

  /* ============ BUTTONS ============ */
  .btn {
    border: none; cursor: pointer; font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 10px;
    transition: .2s; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-ghost { background: var(--primary-light); color: var(--primary-dark); }
  .btn-ghost:hover { background: #b2f5ea; }
  .btn-sm { padding: 8px 12px; font-size: 13px; }
  .btn-icon {
    background: #f1f5f9; padding: 8px 10px; border-radius: 10px;
    font-size: 12px; line-height: 1; color: var(--text);
    font-weight: 600;
  }
  .btn-icon:hover { background: #e2e8f0; }

  .cart-btn { position: relative; }
  .cart-badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--primary-dark); color: #fff;
    font-size: 11px; font-weight: 700;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 999px; display: grid; place-items: center;
  }

  /* ============ HERO ============ */
  .hero {
    max-width: 1200px; margin: 26px auto 0; padding: 0 20px;
  }
  .hero-box {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 22px; padding: 30px 28px; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px; flex-wrap: wrap;
  }
  .hero-box h1 { font-size: 26px; margin-bottom: 6px; }
  .hero-box p { opacity: .9; font-size: 14px; }
  .hero-box .btn { background: #fff; color: var(--primary-dark); }
  .hero-box .btn:hover { background: var(--primary-light); }

  /* ============ GRID ============ */
  .container { max-width: 1200px; margin: 0 auto; padding: 26px 20px 0; }
  .section-title {
    font-size: 18px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title span { color: var(--muted); font-weight: 500; font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: .25s; cursor: pointer;
    animation: pop .3s ease;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

  .card:hover { transform: translateY(-5px); box-shadow: 0 14px 34px rgba(13, 148, 136, .2); }

  .thumb { position: relative; aspect-ratio: 4/3; overflow: hidden; background: var(--primary-light); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: .35s; }
  .card:hover .thumb img { transform: scale(1.06); }

  .price-tag {
    position: absolute; left: 10px; bottom: 10px;
    background: rgba(13, 148, 136, .85); color: #fff;
    font-size: 13px; font-weight: 700;
    padding: 5px 11px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-body h3 {
    font-size: 15px; font-weight: 700;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .desc {
    font-size: 13px; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
  .card-actions .btn-primary { flex: 1; justify-content: center; }

  .empty {
    grid-column: 1/-1; text-align: center;
    padding: 60px 20px; color: var(--muted); font-size: 15px;
  }

  /* ============ LOADING ============ */
  .loading {
    grid-column: 1/-1; text-align: center;
    padding: 60px 20px; color: var(--primary-dark); font-size: 15px;
    font-weight: 600;
  }

  /* ============ MODAL ============ */
  .overlay {
    position: fixed; inset: 0; background: rgba(19, 78, 74, .55);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
    opacity: 0; visibility: hidden; transition: .25s;
  }
  .overlay.show { opacity: 1; visibility: visible; }

  .modal {
    background: #fff; border-radius: 20px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    padding: 24px; transform: translateY(18px) scale(.97);
    transition: .25s;
  }
  .overlay.show .modal { transform: translateY(0) scale(1); }

  .modal h2 { font-size: 19px; margin-bottom: 16px; color: var(--primary-dark); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600;
    margin-bottom: 6px; color: var(--primary-dark);
  }
  .field input, .field textarea {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none;
    transition: .2s; background: #fafbff; resize: vertical;
    color: var(--text);
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 4px rgba(13, 148, 136, .15);
  }
  .field small { color: var(--muted); font-size: 12px; }

  .preview {
    width: 100%; height: 170px; object-fit: cover;
    border-radius: 12px; margin-top: 10px;
    border: 1px dashed var(--line); background: #f8fafc; display: none;
  }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ============ DETAIL MODAL ============ */
  .detail-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px; }
  .detail-price {
    font-size: 24px; font-weight: 800; color: var(--primary-dark);
    margin: 14px 0 6px;
  }
  .detail-name { font-size: 20px; font-weight: 700; }
  .detail-desc { font-size: 14px; color: var(--muted); line-height: 1.7; margin-top: 10px; }

  /* ============ CART ============ */
  .cart-panel {
    position: fixed; top: 0; right: 0; height: 100%;
    width: 370px; max-width: 92vw; background: #fff;
    z-index: 210; display: flex; flex-direction: column;
    transform: translateX(105%); transition: .3s cubic-bezier(.4,0,.2,1);
    box-shadow: -12px 0 40px rgba(13, 148, 136, .15);
  }
  .cart-panel.show { transform: translateX(0); }
  .cart-head {
    padding: 20px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-head h2 { font-size: 17px; color: var(--primary-dark); }
  .cart-items { flex: 1; overflow-y: auto; padding: 14px 18px; }

  .cart-item {
    display: flex; gap: 12px; padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .cart-item img {
    width: 62px; height: 62px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
  }
  .ci-info { flex: 1; min-width: 0; }
  .ci-info h4 {
    font-size: 13.5px; font-weight: 700; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ci-price { font-size: 12.5px; color: var(--muted); }

  .qty { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .qty button {
    width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 14px; line-height: 1;
    display: grid; place-items: center; color: var(--text);
  }
  .qty button:hover { background: var(--primary-light); }
  .qty span { font-size: 13px; font-weight: 700; min-width: 18px; text-align: center; }

  .ci-right { text-align: right; display: flex; flex-direction: column; justify-content: space-between; }
  .ci-right strong { font-size: 13.5px; }
  .ci-right .remove {
    background: none; border: none; color: #dc2626; cursor: pointer;
    font-size: 12px; font-weight: 600; padding: 0;
  }
  .ci-right .remove:hover { text-decoration: underline; }

  .cart-foot { padding: 18px 20px; border-top: 1px solid var(--line); background: #f8fafc; }
  .cart-total {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; margin-bottom: 14px;
  }
  .cart-total strong { font-size: 19px; color: var(--primary-dark); }
  .cart-foot .btn { width: 100%; justify-content: center; }

  .cart-empty { text-align: center; color: var(--muted); padding: 50px 10px; font-size: 14px; }

  /* ============ TOAST ============ */
  #toast {
    position: fixed; left: 50%; bottom: 30px;
    transform: translate(-50%, 90px);
    background: var(--primary-dark); color: #fff;
    padding: 12px 22px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    z-index: 400; opacity: 0; transition: .35s;
    pointer-events: none; box-shadow: 0 10px 30px rgba(13, 148, 136, .3);
    max-width: 90vw; text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (max-width: 520px) {
    .hero-box h1 { font-size: 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .card-body { padding: 11px; }
    .logo { font-size: 18px; }
    .header-inner { padding: 12px 14px; }
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- ================= HEADER ================= -->
<header>
  <div class="header-inner">
    <div class="logo">TokoKita</div>
    <input type="text" id="search" class="search" placeholder="Cari produk...">
    <button class="btn btn-primary cart-btn" id="cartBtn">
      Keranjang
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
</header>

<!-- ================= HERO ================= -->
<div class="hero">
  <div class="hero-box">
    <div>
      <h1>Belanja Mudah, Harga Bersahabat</h1>
      <p>Kelola produk, edit, dan tambahkan barang baru sesuka hati.</p>
    </div>
    <button class="btn" id="addBtnTop">Tambah Produk</button>
  </div>
</div>

<!-- ================= PRODUCTS ================= -->
<div class="container">
  <div class="section-title">
    Daftar Produk <span id="productCount"></span>
  </div>
  <div class="grid" id="grid">
    <div class="loading">Memuat produk...</div>
  </div>
</div>

<!-- ================= MODAL FORM ================= -->
<div class="overlay" id="formModal">
  <div class="modal">
    <h2 id="formTitle">Tambah Produk</h2>
    <form id="productForm">
      <div class="field">
        <label>Nama Produk</label>
        <input type="text" id="pName" required placeholder="Contoh: Kaos Polos Premium">
      </div>

      <div class="field">
        <label>Harga Barang (Rp)</label>
        <input type="number" id="pPrice" required min="0" placeholder="85000">
      </div>

      <div class="field">
        <label>Foto Barang</label>
        <input type="url" id="pImage" placeholder="Tempel URL gambar (https://...)">
        <div style="margin-top:8px">
          <input type="file" id="pFile" accept="image/*">
        </div>
        <small>Bisa pakai URL atau upload file dari perangkat.</small>
        <img id="preview" class="preview" alt="Preview">
      </div>

      <div class="field">
        <label>Deskripsi Barang</label>
        <textarea id="pDesc" rows="3" placeholder="Jelaskan bahan, ukuran, keunggulan..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelForm">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= MODAL DETAIL ================= -->
<div class="overlay" id="detailModal">
  <div class="modal">
    <img id="dImage" class="detail-img" alt="">
    <div class="detail-price" id="dPrice"></div>
    <div class="detail-name" id="dName"></div>
    <p class="detail-desc" id="dDesc"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="closeDetail">Tutup</button>
      <button class="btn btn-primary" id="detailCart">Tambah ke Keranjang</button>
    </div>
  </div>
</div>

<!-- ================= CART PANEL ================= -->
<div class="overlay" id="cartOverlay"></div>
<aside class="cart-panel" id="cartPanel">
  <div class="cart-head">
    <h2>Keranjang Belanja</h2>
    <button class="btn btn-icon" id="closeCart">Tutup</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">Rp 0</strong>
    </div>
    <button class="btn btn-primary" id="checkoutBtn">Checkout Sekarang</button>
  </div>
</aside>

<div id="toast"></div>

<script>
/* =========================================================
   KONFIGURASI SUPABASE
   ---------------------------------------------------------
   Ganti dua nilai di bawah dengan milik Anda.
   Bisa dilihat di: Supabase Dashboard -> Project Settings -> API
   ========================================================= */

const SUPABASE_URL = 'https://mtjdkivqcltdbgdauapl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10amRraXZxY2x0ZGJnZGF1YXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDUzOTEsImV4cCI6MjEwNjQyMTM5MX0.chzAnuC2SEAVmCw-R6cfLWreYftJq8TozCrQ3qVAYTQ';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   1. HELPER
   ========================================================= */
const $ = (s) => document.querySelector(s);

const rupiah = (n) =>
  new Intl.NumberFormat('id-ID', {
    style: 'currency', currency: 'IDR', minimumFractionDigits: 0
  }).format(n);

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (m) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[m]));

/* Placeholder SVG (tanpa emoji, warna teal) */
function createPlaceholder(text, c1, c2) {
  const safe = String(text).replace(/[<>&"]/g, '');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="600" height="450" fill="url(#g)"/>
    <text x="300" y="250" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" font-weight="bold" text-anchor="middle" opacity="0.7">${safe}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* =========================================================
   2. STATE
   ========================================================= */
const CART_KEY = 'tokokita_cart_v1';

let products = [];
let cart = {};
let imageValue = '';
let editId = null;
let detailId = null;

/* =========================================================
   3. CART STORAGE (tetap pakai localStorage — data keranjang
      memang per-pengunjung, tidak perlu di cloud)
   ========================================================= */
function loadCart() {
  try {
    cart = JSON.parse(localStorage.getItem(CART_KEY)) || {};
  } catch (e) {
    cart = {};
  }
}
function saveCart() {
  try {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  } catch (e) {
    console.warn('Gagal menyimpan keranjang', e);
  }
}

/* =========================================================
   4. TOAST
   ========================================================= */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* =========================================================
   5. SUPABASE: LOAD PRODUK
   ========================================================= */
const grid = $('#grid');

async function loadData() {
  grid.innerHTML = `<div class="loading">Memuat produk...</div>`;

  const { data, error } = await supabase
    .from('products')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error('Gagal memuat produk:', error);
    products = [];
    grid.innerHTML = `<div class="empty">Gagal memuat produk dari server.<br>${escapeHtml(error.message)}</div>`;
    return false;
  }

  products = (data || []).map(p => ({
    id: p.id,
    name: p.name,
    price: p.price,
    image: p.image || createPlaceholder('Produk', '#5eead4', '#0d9488'),
    desc: p.description || ''
  }));

  return true;
}

/* =========================================================
   6. RENDER PRODUK
   ========================================================= */
function renderProducts() {
  const q = $('#search').value.trim().toLowerCase();
  const list = products.filter(p =>
    p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q)
  );

  $('#productCount').textContent = `(${products.length} item)`;

  if (!products.length) {
    grid.innerHTML = `<div class="empty">Belum ada produk.<br>Klik tombol "Tambah Produk" untuk mulai berjualan.</div>`;
    return;
  }

  if (!list.length) {
    grid.innerHTML = `<div class="empty">Produk tidak ditemukan.<br>Coba kata kunci lain.</div>`;
    return;
  }

  grid.innerHTML = list.map(p => `
    <div class="card" data-id="${p.id}">
      <div class="thumb">
        <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}"
             onerror="this.src='${createPlaceholder('No Image', '#e2e8f0', '#94a3b8')}'">
        <span class="price-tag">${rupiah(p.price)}</span>
      </div>
      <div class="card-body">
        <h3>${escapeHtml(p.name)}</h3>
        <p class="desc">${escapeHtml(p.desc || 'Tanpa deskripsi.')}</p>
        <div class="card-actions">
          <button class="btn btn-primary btn-sm" data-action="cart">Beli</button>
          <button class="btn btn-icon" data-action="edit" title="Edit produk">Edit</button>
          <button class="btn btn-icon" data-action="delete" title="Hapus produk">Hapus</button>
        </div>
      </div>
    </div>
  `).join('');
}

/* Delegasi klik pada grid */
grid.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const actionBtn = e.target.closest('[data-action]');
  const action = actionBtn ? actionBtn.dataset.action : null;

  if (action === 'cart') {
    addToCart(id);
  } else if (action === 'edit') {
    openForm(id);
  } else if (action === 'delete') {
    deleteProduct(id);
  } else {
    openDetail(id);
  }
});

/* =========================================================
7. FORM TAMBAH / EDIT
   ========================================================= */
const formModal = $('#formModal');
const preview = $('#preview');
const pImage = $('#pImage');
const pFile = $('#pFile');
const submitBtn = $('#submitBtn');

function openForm(id = null) {
  editId = id;
  const p = id ? products.find(x => x.id === id) : null;

  $('#formTitle').textContent = p ? 'Edit Produk' : 'Tambah Produk';
  $('#pName').value = p ? p.name : '';
  $('#pPrice').value = p ? p.price : '';
  $('#pDesc').value = p ? (p.desc || '') : '';
  pImage.value = (p && /^https?:\/\//i.test(p.image)) ? p.image : '';
  pFile.value = '';

  imageValue = p ? p.image : '';

  if (p) {
    preview.src = p.image;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
    preview.removeAttribute('src');
  }

  submitBtn.disabled = false;
  submitBtn.textContent = 'Simpan';

  formModal.classList.add('show');
  setTimeout(() => $('#pName').focus(), 200);
}

function closeForm() {
  formModal.classList.remove('show');
  editId = null;
}

/* Preview saat URL diketik */
pImage.addEventListener('input', () => {
  const v = pImage.value.trim();
  if (v) {
    imageValue = v;
    preview.src = v;
    preview.style.display = 'block';
  }
});

/* Preview saat upload file (dikonversi ke base64) */
pFile.addEventListener('change', () => {
  const file = pFile.files[0];
  if (!file) return;
  if (file.size > 1024 * 1024) {
    toast('Ukuran gambar terlalu besar (maks 1MB). Pakai URL saja.');
    pFile.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    imageValue = ev.target.result;
    pImage.value = '';
    preview.src = imageValue;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

/* Submit form: insert atau update ke Supabase */
$('#productForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = $('#pName').value.trim();
  const price = Number($('#pPrice').value);
  const desc = $('#pDesc').value.trim();
  const image = imageValue || createPlaceholder('Produk', '#5eead4', '#0d9488');

  if (!name) return toast('Nama produk wajib diisi!');
  if (isNaN(price) || price < 0) return toast('Harga tidak valid!');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Menyimpan...';

  let error;

  if (editId) {
    // UPDATE
    ({ error } = await supabase
      .from('products')
      .update({
        name: name,
        price: price,
        description: desc,
        image: image
      })
      .eq('id', editId));
  } else {
    // INSERT
    ({ error } = await supabase
      .from('products')
      .insert([{
        name: name,
        price: price,
        description: desc,
        image: image
      }]));
  }

  submitBtn.disabled = false;
  submitBtn.textContent = 'Simpan';

  if (error) {
    console.error(error);
    toast('Gagal menyimpan: ' + error.message);
    return;
  }

  toast(editId ? 'Produk berhasil diperbarui' : 'Produk baru ditambahkan');

  await loadData();
  renderProducts();
  closeForm();
});

/* =========================================================
   8. HAPUS PRODUK
   ========================================================= */
async function deleteProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`Hapus produk "${p.name}"?`)) return;

  const { error } = await supabase
    .from('products')
    .delete()
    .eq('id', id);

  if (error) {
    console.error(error);
    toast('Gagal menghapus: ' + error.message);
    return;
  }

  delete cart[id];
  saveCart();

  await loadData();
  renderProducts();
  renderCart();
  toast('Produk dihapus');
}

/* =========================================================
   9. DETAIL PRODUK
   ========================================================= */
const detailModal = $('#detailModal');

function openDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  detailId = id;

  $('#dImage').src = p.image;
  $('#dName').textContent = p.name;
  $('#dPrice').textContent = rupiah(p.price);
  $('#dDesc').textContent = p.desc || 'Tanpa deskripsi.';

  detailModal.classList.add('show');
}

$('#closeDetail').addEventListener('click', () => detailModal.classList.remove('show'));

$('#detailCart').addEventListener('click', () => {
  if (detailId) {
    addToCart(detailId);
    detailModal.classList.remove('show');
  }
});

/* =========================================================
   10. KERANJANG (tetap lokal per-pengunjung)
   ========================================================= */
const cartPanel = $('#cartPanel');
const cartOverlay = $('#cartOverlay');

function openCart() {
  cartPanel.classList.add('show');
  cartOverlay.classList.add('show');
}
function closeCart() {
  cartPanel.classList.remove('show');
  cartOverlay.classList.remove('show');
}

$('#cartBtn').addEventListener('click', openCart);
$('#closeCart').addEventListener('click', closeCart);
cartOverlay.addEventListener('click', closeCart);

function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  renderCart();
  toast(`"${p.name}" masuk keranjang`);
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id] += delta;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  renderCart();
}

function removeFromCart(id) {
  delete cart[id];
  saveCart();
  renderCart();
  toast('Item dihapus dari keranjang');
}

function renderCart() {
  const items = Object.entries(cart)
    .map(([id, qty]) => ({ product: products.find(p => p.id === id), qty }))
    .filter(x => x.product);

  const totalQty = items.reduce((a, b) => a + b.qty, 0);
  const totalPrice = items.reduce((a, b) => a + b.product.price * b.qty, 0);

  $('#cartBadge').textContent = totalQty;
  $('#cartTotal').textContent = rupiah(totalPrice);

  const box = $('#cartItems');

  if (!items.length) {
    box.innerHTML = `<div class="cart-empty">Keranjang masih kosong.<br>Yuk pilih produk dulu!</div>`;
    return;
  }

  box.innerHTML = items.map(({ product: p, qty }) => `
    <div class="cart-item">
      <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}">
      <div class="ci-info">
        <h4>${escapeHtml(p.name)}</h4>
        <div class="ci-price">${rupiah(p.price)}</div>
        <div class="qty">
          <button data-act="minus" data-id="${p.id}">-</button>
          <span>${qty}</span>
          <button data-act="plus" data-id="${p.id}">+</button>
        </div>
      </div>
      <div class="ci-right">
        <strong>${rupiah(p.price * qty)}</strong>
        <button class="remove" data-act="remove" data-id="${p.id}">Hapus</button>
      </div>
    </div>
  `).join('');
}

$('#cartItems').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const { act, id } = btn.dataset;
  if (act === 'plus') changeQty(id, 1);
  else if (act === 'minus') changeQty(id, -1);
  else if (act === 'remove') removeFromCart(id);
});

$('#checkoutBtn').addEventListener('click', () => {
  const totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
  if (!totalQty) return toast('Keranjang masih kosong!');

  const total = Object.entries(cart).reduce((sum, [id, qty]) => {
    const p = products.find(x => x.id === id);
    return sum + (p ? p.price * qty : 0);
  }, 0);

  alert(
    `Checkout Berhasil!\n\n` +
    `Total item : ${totalQty}\n` +
    `Total bayar: ${rupiah(total)}\n\n` +
    `Terima kasih sudah berbelanja di TokoKita`
  );

  cart = {};
  saveCart();
  renderCart();
  closeCart();
});

/* =========================================================
   11. EVENT GLOBAL
   ========================================================= */
$('#addBtnTop').addEventListener('click', () => openForm());
$('#cancelForm').addEventListener('click', closeForm);
$('#search').addEventListener('input', renderProducts);

[formModal, detailModal].forEach(ov => {
  ov.addEventListener('click', (e) => {
    if (e.target === ov) ov.classList.remove('show');
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    formModal.classList.remove('show');
    detailModal.classList.remove('show');
    closeCart();
  }
});

/* =========================================================
   12. INIT
   ========================================================= */
async function init() {
  loadCart();
  const ok = await loadData();
  if (ok) renderProducts();
  renderCart();
}

init();
</script>
</body>
</html>
