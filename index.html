<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoKita</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0fdfa; color: #134e4a; padding-bottom: 40px; }

  header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #ccfbf1; z-index: 60; }
  .head { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .logo { font-size: 20px; font-weight: 800; color: #0f766e; }
  .search { flex: 1; min-width: 140px; padding: 9px 14px; border: 1px solid #ccfbf1; border-radius: 999px; outline: none; font-size: 14px; }
  .search:focus { border-color: #0d9488; }

  .btn { border: none; cursor: pointer; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: inherit; transition: .2s; }
  .btn-teal { background: #0d9488; color: #fff; }
  .btn-teal:hover { background: #0f766e; }
  .btn-light { background: #ccfbf1; color: #0f766e; }
  .btn-light:hover { background: #b2f5ea; }
  .btn-sm { padding: 7px 11px; font-size: 12px; }
  .btn-red { background: #fee2e2; color: #dc2626; }

  .wrap { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
  .hero { background: linear-gradient(135deg, #0d9488, #0f766e); border-radius: 18px; padding: 26px; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hero h1 { font-size: 22px; margin-bottom: 5px; }
  .hero p { font-size: 13px; opacity: .9; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; margin-top: 20px; }

  .card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 18px rgba(13,148,136,.1); cursor: pointer; transition: .2s; }
  .card:hover { transform: translateY(-4px); }
  .thumb { position: relative; aspect-ratio: 4/3; overflow: hidden; background: #ccfbf1; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .price { position: absolute; bottom: 8px; left: 8px; background: rgba(13,148,136,.9); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }

  .body { padding: 12px; }
  .body h3 { font-size: 14px; margin-bottom: 5px; }
  .body p { font-size: 12px; color: #64748b; line-height: 1.4; height: 34px; overflow: hidden; }
  .actions { display: flex; gap: 5px; margin-top: 8px; }
  .actions .btn-teal { flex: 1; justify-content: center; }

  .info { text-align: center; padding: 50px 20px; color: #64748b; font-size: 14px; }
  .err { text-align: center; padding: 40px 20px; color: #dc2626; font-size: 13px; background: #fef2f2; border-radius: 12px; margin-top: 20px; word-break: break-word; }

  .overlay { position: fixed; inset: 0; background: rgba(19,78,74,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .overlay.on { display: flex; }
  .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; padding: 22px; }
  .modal h2 { font-size: 18px; color: #0f766e; margin-bottom: 14px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #0f766e; margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccfbf1; border-radius: 9px; font-size: 14px; font-family: inherit; outline: none; }
  .field input:focus, .field textarea:focus { border-color: #0d9488; }
  .field textarea { resize: vertical; }
  .field small { color: #64748b; font-size: 11px; }
  #prev { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; margin-top: 8px; display: none; border: 1px solid #ccfbf1; }

  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 100px); background: #0f766e; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: .3s; z-index: 999; max-width: 90vw; text-align: center; }
  #toast.on { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="head">
    <div class="logo">TokoKita</div>
    <input type="text" id="cari" class="search" placeholder="Cari produk...">
    <button class="btn btn-teal" id="btnTambah">Tambah Produk</button>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div>
      <h1>Belanja Mudah, Harga Bersahabat</h1>
      <p>Kelola produk dan tambahkan barang sesuka hati</p>
    </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="err" class="err" style="display:none"></div>
</div>

<!-- Modal Form -->
<div class="overlay" id="formModal">
  <div class="modal">
    <h2 id="formTitle">Tambah Produk</h2>
    <form id="form">
      <div class="field">
        <label>Nama Produk</label>
        <input type="text" id="nama" required placeholder="Contoh: Kaos Polos">
      </div>
      <div class="field">
        <label>Harga (Rp)</label>
        <input type="number" id="harga" required min="0" placeholder="85000">
      </div>
      <div class="field">
        <label>Foto (URL)</label>
        <input type="url" id="gambar" placeholder="https://...">
        <small>Atau upload file di bawah</small>
        <input type="file" id="file" accept="image/*" style="margin-top:6px">
        <img id="prev" alt="">
      </div>
      <div class="field">
        <label>Deskripsi</label>
        <textarea id="desk" rows="3" placeholder="Jelaskan produk..."></textarea>
      </div>
      <div class="row">
        <button type="button" class="btn btn-light" id="btnBatal">Batal</button>
        <button type="submit" class="btn btn-teal" id="btnSimpan">Simpan</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Detail -->
<div class="overlay" id="detailModal">
  <div class="modal">
    <img id="dGambar" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px" alt="">
    <div style="font-size:22px;font-weight:800;color:#0f766e;margin:12px 0 4px" id="dHarga"></div>
    <div style="font-size:18px;font-weight:700" id="dNama"></div>
    <p style="font-size:13px;color:#64748b;line-height:1.6;margin-top:8px" id="dDesk"></p>
    <div class="row">
      <button class="btn btn-light" id="btnTutupDetail">Tutup</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ ISI URL DAN KEY DI SINI ============ */
const SUPABASE_URL = 'https://mtjdkivqcltdbgdauapl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10amRraXZxY2x0ZGJnZGF1YXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDUzOTEsImV4cCI6MjEwNjQyMTM5MX0.chzAnuC2SEAVmCw-R6cfLWreYftJq8TozCrQ3qVAYTQ';
/* ================================================= */

// Cek library Supabase
if (typeof window.supabase === 'undefined') {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = 'Library Supabase gagal dimuat. Cek koneksi internet atau matikan adblocker, lalu refresh.';
  throw new Error('Supabase CDN tidak dimuat');
}

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (s) => document.querySelector(s);

function rp(n) {
  return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0 }).format(n);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function placeholder(text) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450"><rect width="600" height="450" fill="#0d9488"/><text x="300" y="240" font-family="Arial" font-size="32" fill="#fff" text-anchor="middle">${text}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

let produkList = [];
let editId = null;
let imgVal = '';

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2000);
}

function showError(msg) {
  const e = $('#err');
  e.style.display = 'block';
  e.textContent = msg;
}

function hideError() {
  $('#err').style.display = 'none';
}

/* ============ LOAD PRODUK ============ */
async function loadProduk() {
  $('#grid').innerHTML = '<div class="info">Memuat produk...</div>';
  hideError();

  const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    $('#grid').innerHTML = '';
    showError('Gagal memuat produk: ' + error.message);
    return;
  }

  produkList = (data || []).map(p => ({
    id: p.id,
    name: p.name,
    price: p.price,
    image: p.image || placeholder('Produk'),
    desc: p.description || ''
  }));

  renderProduk();
}

/* ============ RENDER ============ */
function renderProduk() {
  const q = $('#cari').value.trim().toLowerCase();
  const list = produkList.filter(p =>
    p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q)
  );

  if (!produkList.length) {
    $('#grid').innerHTML = '<div class="info">Belum ada produk.<br>Klik "Tambah Produk" untuk mulai.</div>';
    return;
  }
  if (!list.length) {
    $('#grid').innerHTML = '<div class="info">Produk tidak ditemukan.</div>';
    return;
  }

  $('#grid').innerHTML = list.map(p => `
    <div class="card" data-id="${p.id}">
      <div class="thumb">
        <img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.src='${placeholder('No Image')}'">
        <span class="price">${rp(p.price)}</span>
      </div>
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.desc || 'Tanpa deskripsi')}</p>
        <div class="actions">
          <button class="btn btn-teal btn-sm" data-act="edit">Edit</button>
          <button class="btn btn-light btn-sm" data-act="hapus">Hapus</button>
        </div>
      </div>
    </div>
  `).join('');
}

/* ============ KLIK KARTU ============ */
$('#grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const act = e.target.dataset.act;

  if (act === 'edit') { bukaForm(id); }
  else if (act === 'hapus') { hapusProduk(id); }
  else { bukaDetail(id); }
});

/* ============ FORM ============ */
function bukaForm(id) {
  editId = id || null;
  const p = id ? produkList.find(x => x.id === id) : null;

  $('#formTitle').textContent = p ? 'Edit Produk' : 'Tambah Produk';
  $('#nama').value = p ? p.name : '';
  $('#harga').value = p ? p.price : '';
  $('#desk').value = p ? p.desc : '';
  $('#gambar').value = (p && /^https?:/i.test(p.image)) ? p.image : '';
  $('#file').value = '';
  imgVal = p ? p.image : '';

  if (p) {
    $('#prev').src = p.image;
    $('#prev').style.display = 'block';
  } else {
    $('#prev').style.display = 'none';
  }

  $('#formModal').classList.add('on');
  setTimeout(() => $('#nama').focus(), 100);
}

function tutupForm() {
  $('#formModal').classList.remove('on');
  editId = null;
}

$('#gambar').addEventListener('input', () => {
  const v = $('#gambar').value.trim();
  if (v) {
    imgVal = v;
    $('#prev').src = v;
    $('#prev').style.display = 'block';
  }
});

$('#file').addEventListener('change', () => {
  const f = $('#file').files[0];
  if (!f) return;
  if (f.size > 1024*1024) { toast('Gambar maks 1MB. Pakai URL saja.'); return; }
  const r = new FileReader();
  r.onload = (e) => {
    imgVal = e.target.result;
    $('#gambar').value = '';
    $('#prev').src = imgVal;
    $('#prev').style.display = 'block';
  };
  r.readAsDataURL(f);
});

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = $('#nama').value.trim();
  const price = Number($('#harga').value);
  const desc = $('#desk').value.trim();
  const image = imgVal || placeholder('Produk');

  if (!name) return toast('Nama wajib diisi');
  if (isNaN(price) || price < 0) return toast('Harga tidak valid');

  $('#btnSimpan').disabled = true;
  $('#btnSimpan').textContent = 'Menyimpan...';

  let error;
  if (editId) {
    ({ error } = await db.from('products').update({ name, price, description: desc, image }).eq('id', editId));
  } else {
    ({ error } = await db.from('products').insert([{ name, price, description: desc, image }]));
  }

  $('#btnSimpan').disabled = false;
  $('#btnSimpan').textContent = 'Simpan';

  if (error) {
    console.error(error);
    toast('Gagal: ' + error.message);
    return;
  }

  toast(editId ? 'Produk diperbarui' : 'Produk ditambahkan');
  tutupForm();
  await loadProduk();
});

$('#btnBatal').addEventListener('click', tutupForm);

/* ============ HAPUS ============ */
async function hapusProduk(id) {
  const p = produkList.find(x => x.id === id);
  if (!p) return;
  if (!confirm('Hapus produk "' + p.name + '"?')) return;

  const { error } = await db.from('products').delete().eq('id', id);
  if (error) { toast('Gagal hapus: ' + error.message); return; }

  toast('Produk dihapus');
  await loadProduk();
}

/* ============ DETAIL ============ */
function bukaDetail(id) {
  const p = produkList.find(x => x.id === id);
  if (!p) return;
  $('#dGambar').src = p.image;
  $('#dNama').textContent = p.name;
  $('#dHarga').textContent = rp(p.price);
  $('#dDesk').textContent = p.desc || 'Tanpa deskripsi';
  $('#detailModal').classList.add('on');
}

$('#btnTutupDetail').addEventListener('click', () => $('#detailModal').classList.remove('on'));

/* ============ TOMBOL TAMBAH (PENTING) ============ */
$('#btnTambah').addEventListener('click', () => bukaForm(null));

/* ============ SEARCH ============ */
$('#cari').addEventListener('input', renderProduk);

/* ============ TUTUP MODAL ============ */
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => {
    if (e.target === ov) ov.classList.remove('on');
  });
});

/* ============ MULAI ============ */
loadProduk();
</script>
</body>
</html>
