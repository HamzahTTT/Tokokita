<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoKita</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: linear-gradient(135deg, #ccfbf1 0%, #f0fdfa 40%, #e6fffa 100%);
    background-attachment: fixed;
    color: #134e4a;
    min-height: 100vh;
    padding-bottom: 40px;
    position: relative;
    overflow-x: hidden;
  }

  /* Blob dekorasi di background */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .55;
    z-index: -1;
    pointer-events: none;
  }
  body::before {
    width: 320px; height: 320px;
    background: radial-gradient(circle, #5eead4, transparent 70%);
    top: -80px; left: -80px;
    animation: float1 14s ease-in-out infinite;
  }
  body::after {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #99f6e4, transparent 70%);
    bottom: -120px; right: -100px;
    animation: float2 16s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-50px, -30px) scale(1.1); }
  }

  /* ============ HEADER — GLASS ============ */
  header {
    position: sticky; top: 0; z-index: 60;
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 4px 30px rgba(13,148,136,.08);
  }
  .head {
    max-width: 1100px; margin: 0 auto;
    padding: 14px 20px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 800; color: #0f766e;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(255,255,255,.6);
  }
  .search {
    flex: 1; min-width: 120px;
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 999px;
    outline: none; font-size: 14px;
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #134e4a;
    transition: .25s;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.9), 0 2px 8px rgba(13,148,136,.06);
  }
  .search::placeholder { color: #5eaaa3; }
  .search:focus {
    border-color: #5eead4;
    background: rgba(255,255,255,.75);
    box-shadow: 0 0 0 4px rgba(94,234,212,.25), inset 0 1px 2px rgba(255,255,255,.9);
  }

  /* ============ BUTTON BASE — GLASS ============ */
  .btn {
    border: none; cursor: pointer;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 14px; font-weight: 600;
    font-family: inherit;
    position: relative;
    overflow: hidden;
    transition: transform .15s ease, box-shadow .25s ease, background .25s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(.95); }

  .btn-teal {
    background: linear-gradient(135deg, rgba(13,148,136,.95), rgba(15,118,110,.95));
    color: #fff;
    box-shadow:
      0 4px 14px rgba(13,148,136,.35),
      inset 0 1px 1px rgba(255,255,255,.35),
      inset 0 -2px 6px rgba(0,0,0,.1);
    border: 1px solid rgba(255,255,255,.25);
  }
  .btn-teal:hover {
    background: linear-gradient(135deg, rgba(15,118,110,.98), rgba(13,148,136,.98));
    box-shadow:
      0 6px 20px rgba(13,148,136,.45),
      inset 0 1px 1px rgba(255,255,255,.4),
      inset 0 -2px 6px rgba(0,0,0,.12);
  }

  .btn-light {
    background: rgba(255,255,255,.6);
    color: #0f766e;
    border: 1px solid rgba(255,255,255,.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 2px 10px rgba(13,148,136,.1),
      inset 0 1px 1px rgba(255,255,255,.9);
  }
  .btn-light:hover {
    background: rgba(255,255,255,.85);
    box-shadow: 0 4px 14px rgba(13,148,136,.15);
  }

  .btn-sm { padding: 8px 12px; font-size: 12.5px; }

  /* Ripple effect */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    transform: scale(0);
    animation: rippleAnim .6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  .cart-btn { position: relative; }
  .badge {
    position: absolute; top: -6px; right: -6px;
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff; font-size: 11px; font-weight: 700;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 999px; display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(13,148,136,.4), inset 0 1px 1px rgba(255,255,255,.3);
    border: 1px solid rgba(255,255,255,.3);
  }

  /* ============ HERO — GLASS ============ */
  .wrap { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
  .hero {
    background: linear-gradient(135deg, rgba(13,148,136,.9), rgba(15,118,110,.9));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 26px;
    color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    box-shadow:
      0 8px 32px rgba(13,148,136,.3),
      inset 0 1px 1px rgba(255,255,255,.35),
      inset 0 -1px 10px rgba(0,0,0,.1);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.15) 50%, transparent 60%);
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%, 100% { transform: translateX(-30%); }
    50% { transform: translateX(30%); }
  }
  .hero h1 { font-size: 22px; margin-bottom: 5px; position: relative; }
  .hero p { font-size: 13px; opacity: .9; position: relative; }

  /* ============ GRID & CARDS — GLASS ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }

  .card {
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 8px 24px rgba(13,148,136,.12),
      inset 0 1px 1px rgba(255,255,255,.9),
      inset 0 -1px 2px rgba(13,148,136,.05);
    cursor: pointer;
    transition: transform .3s ease, box-shadow .3s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow:
      0 16px 34px rgba(13,148,136,.2),
      inset 0 1px 1px rgba(255,255,255,.95);
  }
  .card:active { transform: translateY(-2px) scale(.99); }

  .thumb {
    position: relative;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: rgba(204,251,241,.6);
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform .4s ease;
  }
  .card:hover .thumb img { transform: scale(1.05); }

  .price {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(15,118,110,.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 5px 11px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 4px 10px rgba(13,148,136,.3);
  }

  .body { padding: 12px 12px 14px; }
  .body h3 { font-size: 14px; margin-bottom: 5px; }
  .body p { font-size: 12px; color: #5e7a77; line-height: 1.4; height: 34px; overflow: hidden; }
  .body .btn-teal { width: 100%; justify-content: center; margin-top: 10px; }

  /* ============ TOMBOL BELI — ANIMASI SPESIAL ============ */
  .btn-beli {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(13,148,136,.95), rgba(15,118,110,.95));
    color: #fff;
    box-shadow:
      0 4px 14px rgba(13,148,136,.35),
      inset 0 1px 1px rgba(255,255,255,.35);
    border: 1px solid rgba(255,255,255,.25);
    transition: transform .2s cubic-bezier(.68,-0.55,.27,1.55),
                box-shadow .3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-beli .icon {
    display: inline-block;
    transition: transform .4s cubic-bezier(.68,-0.55,.27,1.55);
  }

  .btn-beli:hover .icon { transform: rotate(-15deg) scale(1.2); }

  .btn-beli.pressed {
    animation: beliPop .5s cubic-bezier(.68,-0.55,.27,1.55);
  }

  @keyframes beliPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(.88); }
    65%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* Efek gelombang cahaya saat diklik */
  .btn-beli::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,.6) 0%, transparent 60%);
    opacity: 0;
    transition: opacity .3s;
  }
  .btn-beli.pressed::before {
    animation: flashGlow .5s ease-out;
  }
  @keyframes flashGlow {
    0% { opacity: 0; }
    40% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Centang kecil yang muncul sesaat */
  .btn-beli .check-mark {
    display: none;
  }
  .btn-beli.pressed .icon { display: none; }
  .btn-beli.pressed .check-mark { display: inline; animation: checkIn .4s ease; }
  @keyframes checkIn {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  /* ============ INFO / ERROR ============ */
  .info {
    text-align: center; padding: 50px 20px;
    color: #5e7a77; font-size: 14px;
    grid-column: 1/-1;
  }
  .err {
    text-align: center; padding: 40px 20px;
    color: #dc2626; font-size: 13px;
    background: rgba(254,242,242,.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(220,38,38,.2);
    border-radius: 14px;
    margin-top: 20px;
    word-break: break-word;
  }

  /* ============ MODAL — GLASS ============ */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(19,78,74,.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 100;
    opacity: 0;
    transition: opacity .3s;
  }
  .overlay.on { display: flex; opacity: 1; }

  .modal {
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 22px;
    width: 100%; max-width: 440px;
    max-height: 90vh; overflow-y: auto;
    padding: 22px;
    box-shadow:
      0 20px 50px rgba(13,148,136,.25),
      inset 0 1px 1px rgba(255,255,255,.95);
    transform: translateY(20px) scale(.96);
    transition: transform .35s cubic-bezier(.68,-0.55,.27,1.55);
  }
  .overlay.on .modal { transform: translateY(0) scale(1); }

  .check-circle {
    width: 80px; height: 80px;
    margin: 0 auto;
    background: linear-gradient(135deg, rgba(204,251,241,.9), rgba(153,246,228,.9));
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 50%;
    display: grid; place-items: center;
    box-shadow:
      0 8px 24px rgba(13,148,136,.25),
      inset 0 1px 2px rgba(255,255,255,.9);
    animation: popCircle .55s cubic-bezier(.68,-0.55,.27,1.55);
  }
  @keyframes popCircle {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .check-circle svg path {
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: drawCheck .5s ease .3s forwards;
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  /* ============ CART PANEL — GLASS ============ */
  .cart-panel {
    position: fixed; top: 0; right: 0; height: 100%;
    width: 350px; max-width: 92vw;
    background: rgba(255,255,255,.8);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-left: 1px solid rgba(255,255,255,.9);
    z-index: 200;
    display: flex; flex-direction: column;
    transform: translateX(105%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    box-shadow: -12px 0 40px rgba(13,148,136,.2);
  }
  .cart-panel.on { transform: translateX(0); }
  .cart-head {
    padding: 18px;
    border-bottom: 1px solid rgba(204,251,241,.6);
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-head h2 { font-size: 16px; color: #0f766e; }
  .cart-items { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .cart-item {
    display: flex; gap: 10px;
    padding: 12px;
    margin-bottom: 8px;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(13,148,136,.06), inset 0 1px 1px rgba(255,255,255,.9);
  }
  .cart-item img {
    width: 60px; height: 60px;
    border-radius: 10px; object-fit: cover;
  }
  .ci-info { flex: 1; min-width: 0; }
  .ci-info h4 {
    font-size: 13px; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ci-info .p { font-size: 12px; color: #5e7a77; }
  .qty { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .qty button {
    width: 24px; height: 24px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(8px);
    cursor: pointer; color: #0f766e; font-weight: 700;
    transition: .2s;
    box-shadow: 0 2px 5px rgba(13,148,136,.1), inset 0 1px 1px rgba(255,255,255,.9);
  }
  .qty button:hover { background: rgba(204,251,241,.9); }
  .qty button:active { transform: scale(.9); }
  .qty span { font-size: 13px; font-weight: 700; min-width: 18px; text-align: center; }
  .ci-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
  .ci-right strong { font-size: 13px; }
  .ci-right .rm {
    background: none; border: none; color: #dc2626;
    font-size: 11px; font-weight: 600; cursor: pointer; padding: 0;
  }
  .cart-foot {
    padding: 16px 18px;
    border-top: 1px solid rgba(204,251,241,.6);
    background: rgba(240,253,250,.6);
    backdrop-filter: blur(10px);
  }
  .cart-total {
    display: flex; justify-content: space-between;
    font-size: 14px; margin-bottom: 12px;
  }
  .cart-total strong { font-size: 18px; color: #0f766e; }
  .cart-foot .btn { width: 100%; }

  /* ============ TOAST — GLASS ============ */
  #toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 100px);
    background: rgba(15,118,110,.9);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    color: #fff;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 13px; font-weight: 600;
    border: 1px solid rgba(255,255,255,.25);
    opacity: 0;
    transition: .35s cubic-bezier(.68,-0.55,.27,1.55);
    z-index: 999;
    max-width: 90vw; text-align: center;
    box-shadow:
      0 10px 30px rgba(13,148,136,.4),
      inset 0 1px 1px rgba(255,255,255,.3);
  }
  #toast.on { transform: translate(-50%, 0); opacity: 1; }

  #cartOverlay {
    position: fixed; inset: 0;
    background: rgba(19,78,74,.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    z-index: 150;
  }
  #cartOverlay.on { display: block; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .hero h1 { font-size: 18px; }
    .hero p { font-size: 12px; }
    .logo { font-size: 16px; }
    .head { padding: 12px 14px; gap: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="head">
    <div class="logo">TokAMBACONG</div>
    <input type="text" id="cari" class="search" placeholder="Cari produk...">
    <button class="btn btn-teal cart-btn" id="btnCart">
      Keranjang <span class="badge" id="badge">0</span>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>ALL YOU CAN BUY</h1>
    <p>BELANJA DITOKO AMBACONG GRATIS MUWANI</p>
  </div>
  <div id="grid" class="grid"></div>
  <div id="err" class="err" style="display:none"></div>
</div>

<!-- Modal Detail -->
<div class="overlay" id="detailModal">
  <div class="modal">
    <img id="dGambar" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px" alt="">
    <div style="font-size:22px;font-weight:800;color:#0f766e;margin:12px 0 4px" id="dHarga"></div>
    <div style="font-size:18px;font-weight:700" id="dNama"></div>
    <p style="font-size:13px;color:#5e7a77;line-height:1.6;margin-top:8px" id="dDesk"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-light" id="btnTutupDetail">Tutup</button>
      <button class="btn btn-teal" id="btnBeliDetail">Beli</button>
    </div>
  </div>
</div>

<!-- Modal Checkout -->
<div class="overlay" id="checkoutModal">
  <div class="modal" style="text-align:center;max-width:380px">
    <div class="check-circle">
      <svg width="48" height="48" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="24" fill="none" stroke="#0d9488" stroke-width="3"/>
        <path d="M14 27 L23 36 L38 19" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 style="color:#0f766e;margin:14px 0 6px;font-size:20px">Checkout Berhasil!</h2>
    <p style="font-size:13px;color:#5e7a77;margin-bottom:16px">Terima kasih sudah berbelanja</p>

    <div style="background:rgba(204,251,241,.5);border:1px solid rgba(255,255,255,.8);border-radius:14px;padding:14px;text-align:left;font-size:13px;box-shadow:inset 0 1px 1px rgba(255,255,255,.9)">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="color:#5e7a77">Total item</span>
        <strong id="modalQty">0</strong>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:15px">
        <span style="color:#5e7a77">Total bayar</span>
        <strong style="color:#0f766e" id="modalTotal">Rp 0</strong>
      </div>
    </div>

    <button class="btn btn-teal" id="btnTutupModal" style="width:100%;margin-top:16px">OK</button>
  </div>
</div>

<!-- Cart Panel -->
<div id="cartOverlay"></div>
<aside class="cart-panel" id="cartPanel">
  <div class="cart-head">
    <h2>Keranjang Belanja</h2>
    <button class="btn btn-light" id="btnTutupCart">Tutup</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">Rp 0</strong>
    </div>
    <button class="btn btn-teal" id="btnCheckout">Checkout</button>
  </div>
</aside>

<div id="toast"></div>

<script>
/* ============ KONFIG SUPABASE ============ */
const SUPABASE_URL = 'https://mtjdkivqcltdbgdauapl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10amRraXZxY2x0ZGJnZGF1YXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDUzOTEsImV4cCI6MjEwNjQyMTM5MX0.chzAnuC2SEAVmCw-R6cfLWreYftJq8TozCrQ3qVAYTQ';

if (typeof window.supabase === 'undefined') {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = 'Library Supabase gagal dimuat. Cek koneksi internet, lalu refresh.';
  throw new Error('Supabase CDN tidak dimuat');
}

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);

function rp(n) {
  return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0 }).format(n);
}
function esc(s) {
